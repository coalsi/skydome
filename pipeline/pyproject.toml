[project]
name = "skydome-pipeline"
version = "0.1.0"
license = "MIT"
description = "SkyDome geometry, camera models, dome projection and stitch LUTs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[dependency-groups]
# Lens calibration (tools/calibrate_intrinsics.py); not needed at runtime
calib = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8.0", { include-group = "calib" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skydome_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
