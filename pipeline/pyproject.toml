[project]
name = "skydome-pipeline"
version = "0.1.0"
license = "MIT"
description = "SkyDome geometry, camera models, dome projection and stitch LUTs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.0",
    # The web page's API and ONVIF on port 80 (tools/run_server.py, D-021)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Satellites for the sky watcher (skymodel.py, D-030)
    "sgp4>=2.23",
    # The sky watcher's image work (skywatch.py, D-030); also lens calibration
    "opencv-python-headless>=4.8",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skydome_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
