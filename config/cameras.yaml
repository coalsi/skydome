# The all-sky camera (DECISIONS.md D-029, D-031): one ZWO ASI678MC looking
# up through a fisheye lens. (The 5-camera rig of D-001..D-028 is in git
# history; the tools still take any number of cameras.)
#
# device: how skydome-live finds it. "asi" is the first ZWO camera on USB;
# "asi:PART-OF-NAME" picks one by name. A UVC camera gives its id_path (its
# physical USB port, never /dev/videoN) instead.
#
# pointing is only the starting guess: the stars (tools/align_from_stars.py,
# D-027/D-028) write the real rotation to config/calibration/extrinsics.yaml,
# and fit the lens to config/calibration/<name>.yaml.
#   az_deg   0 = north, 90 = east (clockwise seen from above)
#   alt_deg  90 = straight up
#   roll_deg rotation about the optical axis
#
# lens is the nominal model until the stars have fitted one.

sensor:
  width: 3840             # ASI678MC, 2.0 µm pixels, 7.7 x 4.3 mm
  height: 2160

lens:
  hfov_deg: 176           # across the sensor's width: the stock lens at 2.5 mm, a guess until the stars fit it
  projection: equidistant

cameras:
  - name: sky
    device: asi
    pointing: {az_deg: 0, alt_deg: 90, roll_deg: 0}
